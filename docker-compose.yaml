version: '3.8'

services:
  mongo:
    image: mongo:latest
    ports:
      - "27018:27017"
    volumes:
      - quizy-mongo:/data/db
    networks:
      - quizy-net

  keycloak:
    image: quay.io/keycloak/keycloak
    command: start-dev
    ports:
      - "8091:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin123
    volumes:
      - keycloak-data:/opt/keycloak/data
    networks:
      - quizy-net

volumes:
  quizy-mongo:
  keycloak-data:

networks:
  quizy-net: